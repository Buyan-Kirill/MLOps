repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: Run tests
        entry: python -m pytest
        language: python
        always_run: true
        pass_filenames: false
        additional_dependencies:
          - pandas>=2.2.0
          - numpy>=1.21.0
          - torch>=2.0.0
          - sentence-transformers>=2.2.0
          - scikit-learn>=1.2.0
          - matplotlib>=3.6.0
          - PyYAML>=6.0
          - tqdm>=4.64.0
          - transformers>=4.30.0
          - pytest>=7.0.0
          - scipy>=1.9.0
          - flake8>=6.0.0
          - kaggle>=1.5.12
          - pyarrow>=12.0.0
          - mlflow>=2.10.0,<3.0.0
